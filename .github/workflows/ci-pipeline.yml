name: LANOVEL CI Pipeline

on:
  push:
    branches: [ "main", "extra" ]
  pull_request:
    branches: [ "main", "extra" ]

jobs:
  python-lint-and-test:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint
        run: |
          ruff check server/ scripts/

      - name: Run Core Test Suite
        run: |
          pytest tests/test_corpus_ai_service.py tests/test_character_fixer.py tests/test_sync_router.py tests/test_unclassified.py tests/test_dictionary_service.py -v

  extension-js-lint:
    name: Extension JS Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: "latest"

      - name: Run Biome Lint
        run: |
          biome lint extension/ --diagnostic-level=error

  mobile-flutter-analyze:
    name: Mobile Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: mobile_app
        run: |
          flutter pub get

      - name: Run Flutter Analyze
        working-directory: mobile_app
        run: |
          flutter analyze --no-fatal-infos

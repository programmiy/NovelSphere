        async function saveContextQuickEdit(transId) {
            const input = document.getElementById(`ctx-edit-input-${transId}`);
            if (!input) return;
            const newText = input.value.trim();
            if (!newText) {
                showToast("수정할 번역 내용을 입력해주세요.", false);
                return;
            }
            try {
                const res = await fetch('/api/ai_review/context/quick_edit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ translation_id: transId, translated_text: newText })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast(data.message || "문맥 번역이 성공적으로 저장되었습니다.");
                    const viewEl = document.getElementById(`ctx-trans-view-${transId}`);
                    if (viewEl) viewEl.textContent = newText;
                    toggleContextQuickEdit(transId);
                } else {
                    showToast(data.message || "저장 실패", false);
                }
            } catch(e) {
                showToast("네트워크 오류", false);
            }
        }

        function toggleContextQuickEdit(transId) {
            const box = document.getElementById(`ctx-edit-box-${transId}`);
            const view = document.getElementById(`ctx-trans-view-${transId}`);
            if (box) {
                const isHidden = box.style.display === 'none';
                box.style.display = isHidden ? 'block' : 'none';
                if (view) view.style.display = isHidden ? 'none' : 'block';
                if (isHidden) {
                    const input = document.getElementById(`ctx-edit-input-${transId}`);
                    if (input) input.focus();
                }
            }
        }

        // --- Dynamic Dock Button Physics ---
        function updateDockButtonsByRatio(ratioX) {
            // ratioX: -1.0 (가장 왼쪽) ~ +1.0 (가장 오른쪽)
            const rejectBtn = document.querySelector('.circle-btn.reject');
            const approveBtn = document.querySelector('.circle-btn.approve');
            if (!rejectBtn || !approveBtn) return;

            // 마우스 움직임 중에는 transition을 제거하여 딜레이 0ms 즉각 반응!
            rejectBtn.style.transition = 'none';
            approveBtn.style.transition = 'none';

            if (ratioX < -0.05) {
                // 마우스가 왼쪽(거절/X)으로 이동 -> X 버튼 실시간 3D 팝업 돌출!
                const intensity = Math.min(Math.abs(ratioX), 1.0);
                const scale = 1 + (intensity * 0.28);
                const ty = -intensity * 16;
                rejectBtn.style.transform = `translate3d(0, ${ty}px, 25px) scale(${scale})`;
                rejectBtn.style.boxShadow = `0 15px 35px -5px rgba(220, 38, 38, ${0.3 + intensity * 0.45}), 0 0 ${intensity * 35}px var(--accent-reject-glow)`;
                rejectBtn.style.borderColor = `rgba(239, 68, 68, ${0.4 + intensity * 0.6})`;
                
                // 반대편 하트 버튼은 살짝 축소 및 페이드
                const dimScale = Math.max(0.85, 1 - intensity * 0.15);
                approveBtn.style.transform = `scale(${dimScale})`;
                approveBtn.style.opacity = `${Math.max(0.45, 1 - intensity * 0.45)}`;
                approveBtn.style.boxShadow = 'var(--circle-btn-shadow)';
                approveBtn.style.borderColor = 'var(--circle-btn-border)';
            } else if (ratioX > 0.05) {
                // 마우스가 오른쪽(승인/하트)으로 이동 -> 하트 버튼 실시간 3D 팝업 돌출!
                const intensity = Math.min(ratioX, 1.0);
                const scale = 1 + (intensity * 0.28);
                const ty = -intensity * 16;
                approveBtn.style.transform = `translate3d(0, ${ty}px, 25px) scale(${scale})`;
                approveBtn.style.boxShadow = `0 15px 35px -5px rgba(16, 185, 129, ${0.3 + intensity * 0.45}), 0 0 ${intensity * 35}px var(--accent-approve-glow)`;
                approveBtn.style.borderColor = `rgba(16, 185, 129, ${0.4 + intensity * 0.6})`;

                // 반대편 X 버튼은 살짝 축소 및 페이드
                const dimScale = Math.max(0.85, 1 - intensity * 0.15);
                rejectBtn.style.transform = `scale(${dimScale})`;
                rejectBtn.style.opacity = `${Math.max(0.45, 1 - intensity * 0.45)}`;
                rejectBtn.style.boxShadow = 'var(--circle-btn-shadow)';
                rejectBtn.style.borderColor = 'var(--circle-btn-border)';
            } else {
                resetDockButtons();
            }
        }

        function updateDockButtonsByDrag(dragRatio) {
            // dragRatio: currentX / 120 (임계값 120px 기준)
            const rejectBtn = document.querySelector('.circle-btn.reject');
            const approveBtn = document.querySelector('.circle-btn.approve');
            if (!rejectBtn || !approveBtn) return;

            rejectBtn.style.transition = 'none';
            approveBtn.style.transition = 'none';

            if (dragRatio < 0) {
                // 왼쪽 드래그(거절): X 버튼 대폭 팽창 및 네온 폭발
                const progress = Math.min(Math.abs(dragRatio), 1.6);
                const scale = 1 + (progress * 0.35); // 최대 1.45배 이상 팝업
                const ty = -progress * 22;
                rejectBtn.style.transform = `translate3d(0, ${ty}px, 40px) scale(${scale})`;
                rejectBtn.style.boxShadow = `0 20px 45px -5px rgba(220, 38, 38, 0.65), 0 0 ${progress * 50}px var(--accent-reject-glow)`;
                rejectBtn.style.borderColor = 'var(--accent-reject)';
                rejectBtn.style.background = 'var(--accent-reject)';
                rejectBtn.style.color = '#ffffff';

                const icon = rejectBtn.querySelector('.material-icons-round');
                if (icon) icon.style.transform = `rotate(${-progress * 90}deg) scale(1.18)`;

                approveBtn.style.transform = `scale(${Math.max(0.65, 1 - progress * 0.28)})`;
                approveBtn.style.opacity = `${Math.max(0.2, 1 - progress * 0.7)}`;
            } else if (dragRatio > 0) {
                // 오른쪽 드래그(승인): 하트 버튼 대폭 팽창 및 네온 폭발
                const progress = Math.min(dragRatio, 1.6);
                const scale = 1 + (progress * 0.35); // 최대 1.45배 이상 팝업
                const ty = -progress * 22;
                approveBtn.style.transform = `translate3d(0, ${ty}px, 40px) scale(${scale})`;
                approveBtn.style.boxShadow = `0 20px 45px -5px rgba(16, 185, 129, 0.65), 0 0 ${progress * 50}px var(--accent-approve-glow)`;
                approveBtn.style.borderColor = 'var(--accent-approve)';
                approveBtn.style.background = 'var(--accent-approve)';
                approveBtn.style.color = '#ffffff';

                const icon = approveBtn.querySelector('.material-icons-round');
                if (icon) icon.style.transform = `scale(${1 + progress * 0.28})`;

                rejectBtn.style.transform = `scale(${Math.max(0.65, 1 - progress * 0.28)})`;
                rejectBtn.style.opacity = `${Math.max(0.2, 1 - progress * 0.7)}`;
            } else {
                resetDockButtons();
            }
        }

        function resetDockButtons() {
            const rejectBtn = document.querySelector('.circle-btn.reject');
            const approveBtn = document.querySelector('.circle-btn.approve');
            if (!rejectBtn || !approveBtn) return;

            const springTransition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, opacity 0.3s ease, border-color 0.3s ease, background 0.3s ease, color 0.3s ease';
            rejectBtn.style.transition = springTransition;
            approveBtn.style.transition = springTransition;

            rejectBtn.style.transform = '';
            rejectBtn.style.opacity = '1';
            rejectBtn.style.boxShadow = '';
            rejectBtn.style.borderColor = '';
            rejectBtn.style.background = '';
            rejectBtn.style.color = '';

            approveBtn.style.transform = '';
            approveBtn.style.opacity = '1';
            approveBtn.style.boxShadow = '';
            approveBtn.style.borderColor = '';
            approveBtn.style.background = '';
            approveBtn.style.color = '';

            const rIcon = rejectBtn.querySelector('.material-icons-round');
            const aIcon = approveBtn.querySelector('.material-icons-round');
            if (rIcon) rIcon.style.transform = '';
            if (aIcon) aIcon.style.transform = '';
        }

        // --- Cinematic Physics ---
        function getClientX(e) { return e.type.includes('touch') ? e.touches[0].clientX : e.clientX; }
        function getClientY(e) { return e.type.includes('touch') ? e.touches[0].clientY : e.clientY; }
        
        function dragStart(e) {
            if (e.target.tagName === 'TEXTAREA' || e.target.closest('.orig-text')) return;
            if (!activeCardEl) return;
            isDragging = true;
            startX = getClientX(e);
            startY = getClientY(e);
            activeCardEl.style.transition = 'none'; // Disable CSS transition for raw physics
        }
        
        function dragMove(e) {
            if (!isDragging || !activeCardEl) return;
            
            currentX = getClientX(e) - startX;
            currentY = getClientY(e) - startY;
            
            // Calculate 3D rotation based on drag
            const rotateZ = currentX * 0.05;
            const rotateY = currentX * 0.02;
            const rotateX = -currentY * 0.02;
            
            activeCardEl.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) rotateX(${rotateX}deg) rotateY(${rotateY}deg) rotateZ(${rotateZ}deg)`;
            
            // Stamps opacity
            const approveStamp = activeCardEl.querySelector('.stamp-approve');
            const rejectStamp = activeCardEl.querySelector('.stamp-reject');
            if (currentX > 0) {
                approveStamp.style.opacity = Math.min(currentX / 150, 1);
                approveStamp.style.transform = `rotate(15deg) scale(${1 + (currentX/500)})`;
                rejectStamp.style.opacity = 0;
            } else {
                rejectStamp.style.opacity = Math.min(Math.abs(currentX) / 150, 1);
                rejectStamp.style.transform = `rotate(-15deg) scale(${1 + (Math.abs(currentX)/500)})`;
                approveStamp.style.opacity = 0;
            }

            // 드래그 거리에 비례하여 X / 하트 버튼 즉각적 대폭 팝업!
            updateDockButtonsByDrag(currentX / 120);
        }
        
        function dragEnd() {
            if (!isDragging || !activeCardEl) return;
            isDragging = false;
            
            // Re-enable cinematic CSS transition
            activeCardEl.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease';
            
            const threshold = 120;
            if (currentX > threshold) triggerAction('right', currentX, currentY);
            else if (currentX < -threshold) triggerAction('left', currentX, currentY);
            else {
                // Snap back physics
                activeCardEl.style.transform = `translate3d(0, 0, 0) rotateX(0) rotateY(0) rotateZ(0)`;
                activeCardEl.querySelector('.stamp-approve').style.opacity = 0;
                activeCardEl.querySelector('.stamp-reject').style.opacity = 0;
                resetDockButtons();
            }
            currentX = 0; currentY = 0;
        }

        async function triggerAction(direction, velX = 0, velY = 0) {
            if (currentIndex >= currentQueue.length || !activeCardEl) return;
            const item = currentQueue[currentIndex];
            const editedText = document.getElementById(`trans-${item.queue_id}`).value.trim();
            
            // Fly away math
            const flyX = direction === 'right' ? window.innerWidth : -window.innerWidth;
            const flyY = velY * 2;
            const rotZ = direction === 'right' ? 45 : -45;
            
            activeCardEl.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease';
            activeCardEl.style.transform = `translate3d(${flyX}px, ${flyY}px, 0) rotateZ(${rotZ}deg)`;
            activeCardEl.style.opacity = '0';
            
            // Add stamp immediately if clicked by button
            if (velX === 0) {
                const stamp = activeCardEl.querySelector(direction === 'right' ? '.stamp-approve' : '.stamp-reject');
                stamp.style.opacity = 1;
                stamp.style.transform = `rotate(${direction === 'right' ? 15 : -15}deg) scale(1.5)`;
            }

            const actionBtn = document.querySelector(direction === 'right' ? '.circle-btn.approve' : '.circle-btn.reject');
            if (actionBtn) {
                actionBtn.style.transform = 'scale(1.32)';
                setTimeout(() => { if (actionBtn) actionBtn.style.transform = ''; }, 200);
            }

            spawnActionConfetti(direction);
            
            if (direction === 'left') await sendAction('reject', item.queue_id, null);
            else await sendAction('approve', item.queue_id, editedText);
            
            lastAction = { type: direction, id: item.queue_id };
            document.getElementById('undoBtn').style.display = 'flex';
            
            setTimeout(() => {
                currentIndex++;
                activeCardEl = null;
                resetDockButtons();
                renderCards();
            }, 300);
        }

        async function sendAction(action, queue_id, translated_text) {
            try {
                const res = await fetch(`/api/ai_review/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ queue_id, translated_text })
                });
                const data = await res.json();
                loadStats();
            } catch (e) {}
        }

        async function undoLastAction() {
            if (!lastAction) return;
            document.getElementById('undoBtn').style.display = 'none';
            try {
                await fetch('/api/ai_review/undo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ queue_id: lastAction.id })
                });
                lastAction = null;
                if (currentIndex > 0) {
                    currentIndex--;
                    renderCards();
                    showToast('Undo Successful');
                }
            } catch (e) {}
        }

        async function handleTextSelection() {
            const selection = window.getSelection();
            const text = selection.toString().trim();
            if (text.length < 2) return;
            
            if (!activeCardEl || !activeCardEl.contains(selection.anchorNode)) return;
            const origNode = activeCardEl.querySelector('.orig-text');
            if (!origNode.contains(selection.anchorNode)) return;
            
            const folder = origNode.dataset.folder || '';
            
            try {
                const res = await fetch(`/api/admin/similar_recommendation?keyword=${encodeURIComponent(text)}&folderName=${encodeURIComponent(folder)}`);
                const data = await res.json();
                
                const popup = document.getElementById('recommendPopup');
                const content = document.getElementById('recommendContent');
                content.innerHTML = '';
                
                if (data.results && data.results.length > 0) {
                    data.results.forEach(r => {
                        const div = document.createElement('div');
                        div.className = 'rec-item';
                        div.innerHTML = `
                            <div class="rec-trans">${r.translated}</div>
                            <div class="rec-meta">Frequency: ${r.count}</div>
                        `;
                        div.onclick = () => {
                            const textarea = activeCardEl.querySelector('textarea');
                            textarea.value = r.translated;
                            popup.style.display = 'none';
                            window.getSelection().removeAllRanges();
                            
                            // Flash effect
                            textarea.style.background = 'rgba(16, 185, 129, 0.2)';
                            setTimeout(() => textarea.style.background = '', 400);
                        };
                        content.appendChild(div);
                    });
                    
                    const rect = selection.getRangeAt(0).getBoundingClientRect();
                    popup.style.left = `${Math.max(10, rect.left)}px`;
                    popup.style.top = `${rect.bottom + window.scrollY + 10}px`;
                    popup.style.display = 'block';
                }
            } catch (e) {}
        }

        // --- Hyper-Visual Ambient Canvas & Particle System ---
        let fxParticles = [];
        let fxConfetti = [];
        let mousePos = { x: -1000, y: -1000 };

        function initAmbientCanvas() {
            const canvas = document.getElementById('ambientCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            window.addEventListener('mousemove', (e) => {
                mousePos.x = e.clientX;
                mousePos.y = e.clientY;
            });

            // 55 Ambient Glowing Stars/Particles
            const colors = ['#6366f1', '#a855f7', '#ec4899', '#06b6d4', '#10b981', '#f59e0b'];
            for (let i = 0; i < 55; i++) {
                fxParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    radius: Math.random() * 2.5 + 1.2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: Math.random() * 0.5 + 0.3,
                    pulseSpeed: Math.random() * 0.02 + 0.01
                });
            }

            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Connecting Constellation Webs
                for (let i = 0; i < fxParticles.length; i++) {
                    const p1 = fxParticles[i];
                    for (let j = i + 1; j < fxParticles.length; j++) {
                        const p2 = fxParticles[j];
                        const dx = p1.x - p2.x;
                        const dy = p1.y - p2.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < 110) {
                            ctx.beginPath();
                            ctx.strokeStyle = p1.color;
                            ctx.globalAlpha = (1 - dist / 110) * 0.18;
                            ctx.lineWidth = 1;
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.stroke();
                        }
                    }
                }

                // Draw Ambient Floating Particles
                for (let p of fxParticles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;

                    // Mouse interaction
                    const mdx = mousePos.x - p.x;
                    const mdy = mousePos.y - p.y;
                    const mdist = Math.hypot(mdx, mdy);
                    if (mdist < 150) {
                        p.x -= (mdx / mdist) * 1.5;
                        p.y -= (mdy / mdist) * 1.5;
                    }

                    p.alpha += Math.sin(Date.now() * p.pulseSpeed) * 0.01;
                    const curAlpha = Math.max(0.15, Math.min(0.85, p.alpha));

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = curAlpha;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = p.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Render Action Confetti Explosions
                for (let i = fxConfetti.length - 1; i >= 0; i--) {
                    const c = fxConfetti[i];
                    c.x += c.vx;
                    c.y += c.vy;
                    c.vy += c.gravity;
                    c.rot += c.vRot;
                    c.life -= 0.016;

                    if (c.life <= 0) {
                        fxConfetti.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.translate(c.x, c.y);
                    ctx.rotate(c.rot);
                    ctx.fillStyle = c.color;
                    ctx.globalAlpha = Math.max(0, c.life);
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = c.color;
                    ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * (c.isSparkle ? 0.4 : 1));
                    ctx.restore();
                }

                ctx.globalAlpha = 1;
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function spawnActionConfetti(direction) {
            const container = document.getElementById('cardContainer') || document.body;
            const rect = container.getBoundingClientRect();
            const originX = rect.left + rect.width / 2;
            const originY = rect.top + rect.height / 2;

            const isApprove = direction === 'right';
            const colors = isApprove
                ? ['#10b981', '#34d399', '#06b6d4', '#38bdf8', '#fbbf24', '#ffffff']
                : ['#ef4444', '#f43f5e', '#fb7185', '#f97316', '#a855f7', '#ffffff'];

            for (let i = 0; i < 48; i++) {
                const angle = (isApprove ? -Math.PI / 4 : -Math.PI * 0.75) + (Math.random() - 0.5) * 1.6;
                const speed = Math.random() * 16 + 8;
                fxConfetti.push({
                    x: originX + (Math.random() - 0.5) * 60,
                    y: originY + (Math.random() - 0.5) * 60,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    gravity: 0.35,
                    rot: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.3,
                    size: Math.random() * 9 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: Math.random() * 0.5 + 0.8,
                    isSparkle: Math.random() > 0.5
                });
            }
        }
    </script>

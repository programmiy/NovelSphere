<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>번역 기록 - UI 개선</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-primary: 'Noto Sans KR', sans-serif;
            --bg-color: #f8f9fa;
            --header-bg: #ffffff;
            --text-color: #212529;
            --text-secondary: #495057;
            --primary-color: #4C6EF5;
            --danger-color: #fa5252;
            --border-color: #dee2e6;
            --card-bg: #ffffff;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            --border-radius: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-primary); background-color: var(--bg-color); color: var(--text-color); font-size: 14px; line-height: 1.6; }
        button, input, select, textarea { font-family: inherit; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .main-header { text-align: center; margin-bottom: 32px; }
        .main-header h1 { font-size: 28px; font-weight: 700; }
        .main-header p { font-size: 16px; color: var(--text-secondary); margin-top: 4px; }
        .controls-bar { background: var(--card-bg); padding: 16px; border-radius: var(--border-radius); margin-bottom: 24px; box-shadow: var(--shadow); border: 1px solid var(--border-color); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .control-group { display: flex; gap: 8px; align-items: center; }
        .control-group.right { margin-left: auto; }
        .form-input, .form-select { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; background-color: #fff; transition: border-color 0.2s, box-shadow 0.2s; }
        .form-input:focus, .form-select:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(76, 110, 245, 0.2); }
        .search-box { min-width: 250px; }
        .btn { padding: 8px 16px; border: 1px solid transparent; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-primary:hover { background-color: #364FC7; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-danger:hover { background-color: #c92a2a; }
        .btn-outline { background-color: transparent; border-color: var(--border-color); color: var(--text-secondary); }
        .btn-outline:hover { background-color: #f1f3f5; }
        #history-container { display: flex; flex-direction: column; gap: 16px; }
        .list-group { background: var(--card-bg); border-radius: var(--border-radius); border: 1px solid var(--border-color); overflow: hidden; }
        .list-group-header { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; user-select: none; background-color: #f8f9fa; }
        .list-group-header:hover { background-color: #f1f3f5; }
        .list-group-toggle { margin-right: 12px; transition: transform 0.2s; }
        .list-group-toggle.collapsed { transform: rotate(-90deg); }
        .list-group-title { font-size: 16px; font-weight: 500; flex-grow: 1; }
        .list-group-actions { display: flex; align-items: center; gap: 8px; }
        .list-group-content { display: block; }
        .list-group-content.collapsed { display: none; }
        .history-item { display: grid; grid-template-columns: 40px 1fr 1fr 120px; align-items: flex-start; padding: 16px; border-top: 1px solid var(--border-color); }
        .history-item:hover { background-color: #f8f9fa; }
        .item-checkbox-container { display: flex; justify-content: center; padding-top: 5px; }
        .item-text-block .text-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
        .item-text-block .text-content { line-height: 1.7; }
        .item-actions-container { text-align: right; }
        .item-date { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
        .item-actions { display: inline-flex; gap: 4px; }
        .item-actions .btn { padding: 4px; font-size: 12px; width: 28px; height: 28px; border-radius: 50%; }
        .empty-state { text-align: center; padding: 80px 20px; background: var(--card-bg); border-radius: var(--border-radius); border: 1px solid var(--border-color); }
        .edit-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: var(--border-radius); padding: 24px; max-width: 700px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 20px; font-weight: 600; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #adb5bd; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-textarea { width: 100%; min-height: 100px; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; resize: vertical; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    </style>
</head>
<body>
    <div class="container">
        <header class="main-header">
            <h1>번역 기록</h1>
            <p>저장된 모든 번역을 탐색하고 관리합니다.</p>
        </header>

        <div class="controls-bar">
            <div class="control-group">
                <input type="text" class="form-input search-box" id="searchBox" placeholder="검색...">
            </div>
            <div class="control-group">
                <select id="folderFilterDropdown" class="form-select">
                    <option value="">모든 폴더</option>
                </select>
            </div>
            <div class="control-group right">
                <button class="btn btn-primary" id="exportPdfBtn">PDF로 내보내기</button>
                <button class="btn btn-outline" id="exportJsonBtn">JSON으로 내보내기</button>
                <button class="btn btn-danger" id="clearAllBtn">전체 삭제</button>
            </div>
             <div class="control-group" id="bulk-actions" style="display: none; width: 100%; background-color: #e7f5ff; padding: 8px; border-radius: 6px; margin-top: 12px;">
                <span id="selection-count"></span>
                <select id="moveSelectedToFolderDropdown" class="form-select" style="min-width: 150px;">
                    <option value="">폴더로 이동...</option>
                </select>
                <button class="btn btn-danger" id="deleteSelectedBtn">선택 삭제</button>
            </div>
        </div>

        <div id="history-container">
            <!-- History items will be rendered here by history.js -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <h2>기록이 없습니다</h2>
            <p>웹페이지에서 일본어를 번역하면 여기에 기록이 저장됩니다.</p>
        </div>
    </div>

    <!-- Modals -->
    <div class="edit-modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">번역 수정</div>
                <button class="close-btn" id="closeModal">×</button>
            </div>
            <div class="form-group">
                <label class="form-label">원본 텍스트</label>
                <textarea class="form-textarea" id="editOriginal" readonly></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">번역 텍스트</label>
                <textarea class="form-textarea" id="editTranslated"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-outline" id="cancelEdit">취소</button>
                <button class="btn btn-primary" id="saveEdit">저장</button>
            </div>
        </div>
    </div>

    <script src="history.js"></script>
</body>
</html>

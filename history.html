<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>번역 기록 - 일본어 번역기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: #e53e3e;
            color: white;
        }

        .btn-danger:hover {
            background: #c53030;
            transform: translateY(-1px);
        }

        .stats {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: 600;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            cursor: pointer;
        }

        .history-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .item-date {
            font-size: 0.85em;
            color: #666;
            background: #f7fafc;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .item-actions {
            display: flex;
            gap: 5px;
        }

        .action-btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
        }

        .edit-btn {
            background: #48bb78;
            color: white;
        }

        .copy-btn {
            background: #4299e1;
            color: white;
        }

        .delete-btn {
            background: #e53e3e;
            color: white;
        }

        .action-btn:hover {
            transform: scale(1.1);
        }

        .original-text {
            background: #f7fafc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .translated-text {
            background: #f0fff4;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #48bb78;
        }

        .text-label {
            font-size: 0.8em;
            font-weight: 600;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .text-content {
            line-height: 1.5;
            word-break: break-all;
            font-size: 18pt;
        }

        .original-text .text-content {
            font-family: 'BIZ UDMincho', serif;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.6;
        }

        .empty-title {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .empty-text {
            opacity: 0.8;
            font-size: 1.1em;
        }

        .edit-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.3em;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #999;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: #f7fafc;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-textarea {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        .form-textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .history-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .stats {
                flex-direction: column;
                gap: 15px;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 번역 기록</h1>
            <p>저장된 일본어 번역들을 확인하고 관리하세요</p>
        </div>

        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="번역 내용 검색...">
            <button class="btn btn-primary" id="exportBtn">📤 내보내기</button>
            <button class="btn btn-primary" id="openGlobalFindReplaceBtn" style="background-color: #ed8936;">🔍 전체 찾아 바꾸기</button> <!-- New button -->
            <button class="btn btn-danger" id="deleteSelectedBtn" style="background-color: #dd6b20; display: none;">🗑️ 선택 삭제</button>
            <button class="btn btn-danger" id="clearAllBtn">🗑️ 전체 삭제</button>
            <button id="clearCacheBtn" class="btn" style="background: #ed8936; margin-left: auto;">🔄 제목 캐시 초기화</button>
        </div>

        <div class="stats" id="stats">
            <div class="stat-item">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">총 번역</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="todayCount">0</div>
                <div class="stat-label">오늘 번역</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="avgLength">0</div>
                <div class="stat-label">평균 길이</div>
            </div>
        </div>

        <div class="history-grid" id="historyGrid">
            <!-- 번역 기록들이 여기에 동적으로 추가됩니다 -->
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">📝</div>
            <div class="empty-title">아직 번역 기록이 없습니다</div>
            <div class="empty-text">웹페이지에서 일본어를 번역하면 여기에 기록이 저장됩니다</div>
        </div>
    </div>

    <!-- 편집 모달 -->
    <div class="edit-modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">번역 수정</div>
                <button class="close-btn" id="closeModal">×</button>
            </div>
            
            <div class="form-group">
                <label class="form-label">원본 텍스트 (일본어)</label>
                <textarea class="form-textarea" id="editOriginal" readonly></textarea>
            </div>
            
            <div class="form-group">
                <label class="form-label">번역 텍스트 (한국어)</label>
                <textarea class="form-textarea" id="editTranslated"></textarea>
            </div>
            
            <div class="modal-actions">
                <button class="btn btn-primary" id="saveEdit">저장</button>
                <button class="btn" id="cancelEdit" style="background: #e2e8f0; color: #4a5568;">취소</button>
            </div>
        </div>
    </div>

    <!-- 찾아 바꾸기 모달 -->
    <div class="edit-modal" id="findReplaceModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">찾아 바꾸기</div>
                <button class="close-btn" id="closeFindReplaceModal">×</button>
            </div>
            <div class="form-group">
                <label class="form-label">찾을 내용</label>
                <input type="text" class="search-box" style="width: 100%" id="findText">
            </div>
            <div class="form-group">
                <label class="form-label">바꿀 내용</label>
                <input type="text" class="search-box" style="width: 100%" id="replaceText">
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" id="executeFindReplace">실행</button>
                <button class="btn" id="cancelFindReplace" style="background: #e2e8f0; color: #4a5568;">취소</button>
            </div>
        </div>
    </div>

    <script src="history.js"></script>
</body>
</html>

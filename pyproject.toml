[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "venv",
    ".venv",
    "inspection_workspace",
    "mobile_app",
    "extension",
]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes (undefined variables, unused imports, duplicate keys)
    "E9",     # Runtime/syntax errors
    "E711",   # Comparison to None
    "E712",   # Comparison to True/False
    "E722",   # Bare except
    "B",      # flake8-bugbear (mutable defaults, loop issues)
]
ignore = [
    "E501",   # Line too long (managed by formatter)
    "B008",   # Do not perform function calls in argument defaults (FastAPI Depends)
    "B904",   # Within an except clause, raise exceptions with from
    "B007",   # Loop control variable not used
]

[tool.ruff.lint.isort]
known-first-party = ["server", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
